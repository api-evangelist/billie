openapi: 3.2.0
info:
  title: Billie Direct Authentication API
  description: '# Introduction


    With PayAfterDelivery (PAD) / "Rechnungskauf" Billie offers a convenient, secure and simple way to allow your

    B2B-customers to pay on invoice.'
  termsOfService: https://www.billie.io/agb/
  license:
    name: © Billie GmbH, 2020
    url: https://www.billie.io/agb/
  version: v2025.11
  x-logo:
    url: data:image/svg+xml;base64,
    href: '#'
servers:
- url: https://paella-sandbox.billie.io/api/v2
  description: Test Sandbox API
- url: https://paella.billie.io/api/v2
  description: Production API
tags:
- name: Authentication
  description: This API uses OAuth 2.0 for secure authentication.
paths:
  /oauth/authorization:
    get:
      tags:
      - Authentication
      summary: Validate OAuth Token
      description: 'Validates the `Authorization: Bearer XXXX` OAuth 2.0 token header and returns a successful response

        with `client_id` and `user_id` or fails if it''s invalid.'
      operationId: oauth_token_validate
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                required:
                - client_id
                - scopes
                properties:
                  client_id:
                    $ref: '#/components/schemas/UUID'
                  scopes:
                    type: array
                    items:
                      type: string
                    default: []
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/ServerError'
  /oauth/token:
    post:
      tags:
      - Authentication
      summary: Request OAuth Token
      description: '### Flow


        The client sends a POST request with following body parameters to the authorization server:


        * `grant_type` with the value `client_credentials`

        * `client_id` with the client''s ID

        * `client_secret` with the client''s secret


        The authorization server will respond with a JSON object containing the following properties:


        * `token_type` with the value `Bearer`

        * `expires_in` with an integer representing the TTL (in seconds) of the access token (Default is 8 hours)

        * `access_token` a JWT signed with the authorization server''s private key


        The `access_token` should be used in the `Authorization` header together with the `Bearer` challenge to authenticate all the requests.


        > Example: `Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c`.'
      operationId: oauth_token_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OauthClientCredentialsGrantRequestBodyParams'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthTokenResponseBody'
  /oauth/token/revoke:
    post:
      tags:
      - Authentication
      summary: Revoke OAuth Token
      description: 'Revokes the oAuth token using the token from the `Authorization: Bearer XXXX` header and returns a 204 response'
      operationId: oauth_token_revoke
      parameters:
      - name: authorization
        in: header
        description: Authorization Header with Token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/ServerError'
components:
  schemas:
    OauthTokenResponseBody:
      title: Request Oauth Token Response
      properties:
        token_type:
          type: string
          example: Bearer
        expires_in:
          description: TTL of the access token in seconds (Default is 8 hours)
          type: integer
        access_token:
          description: JWT signed with the authorization server's private key
          type: string
      type: object
    OauthClientCredentialsGrantRequestBodyParams:
      title: Request OAuth Token
      required:
      - grant_type
      - client_id
      - client_secret
      properties:
        grant_type:
          type: string
          example: client_credentials
        client_id:
          $ref: '#/components/schemas/UUID'
        client_secret:
          type: string
      type: object
    UUID:
      type: string
      format: uuid
      maxLength: 36
      minLength: 36
      example: 12345667-890a-bcde-f123-34567890abcd
    ErrorsObject:
      title: API Errors
      properties:
        errors:
          type: array
          items:
            required:
            - title
            - code
            properties:
              title:
                description: Error message
                type: string
              code:
                description: Error code
                type:
                - string
                - 'null'
              source:
                description: Property path where the error occurred, if applicable
                type:
                - string
                - 'null'
            type: object
      type: object
  responses:
    Forbidden:
      description: Forbidden Request. The operation cannot be completed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsObject'
    ServerError:
      description: Unexpected Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsObject'
    Unauthorized:
      description: Unauthorized request or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsObject'
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'This authentication mechanism is based on the OAuth 2.0 prototocol and requires a Client ID, a Client Secret Key and

        in some cases also a user and password.


        With these credentials, the client should request a token using the `POST /api/v1/oauth/token` endpoint,

        which should be used in the `Authorization` header together with the `Bearer` challenge to authenticate all the requests.


        > Example: `Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c`.'
      flows:
        password:
          tokenUrl: /oauth/token
          scopes:
            default: default
